/* ════════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════ */
let ENGAGEMENTS = [];
let RESPONSES   = [];

async function loadData(){
  const [{ data:engs, error:e1 }, { data:resps, error:e2 }] = await Promise.all([
    SB.from('engagements').select('*').order('ts',{ascending:false}),
    SB.from('responses').select('*').order('ts',{ascending:true}),
  ]);
  if(e1||e2) throw e1||e2;
  ENGAGEMENTS = (engs||[]).map(normaliseEng);
  RESPONSES   = (resps||[]).map(normaliseResp);
}

// Map DB snake_case → JS camelCase
function normaliseEng(e){ return {...e, parentId:e.parent_id}; }
function normaliseResp(r){ return {...r, engId:r.eng_id}; }

/* ════════════════════════════════════════════════════════════
   SCORING
════════════════════════════════════════════════════════════ */
function computeScores(responses){
  const out={};
  PILLARS.forEach(p=>{
    out[p.id]={name:p.name,col:p.col,em:p.em,factors:{},avg:0};
    let ps=[];
    p.factors.forEach(f=>{
      let scores=[];
      f.stmts.forEach(s=>responses.forEach(r=>{
        const v=r.ratings[s.id];
        if(v!=null) scores.push(s.rev?(7-v):v);
      }));
      const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
      out[p.id].factors[f.id]={name:f.name,score:avg};
      ps.push(avg);
    });
    out[p.id].avg=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0;
  });
  return out;
}

function stmtAvgs(responses){
  const out={};
  ALL_STMTS.forEach(s=>{
    const vals=responses.map(r=>r.ratings[s.id]).filter(v=>v!=null).map(v=>s.rev?(7-v):v);
    out[s.id]=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  });
  return out;
}

function rankedFactors(scores){
  return PILLARS.flatMap(p=>p.factors.map(f=>({
    fid:f.id,fname:f.name,pid:p.id,pname:p.name,pcol:p.col,
    score:scores[p.id]?.factors[f.id]?.score??0,
  }))).sort((a,b)=>b.score-a.score);
}

function relCol(rank,total){
  if(rank<total*0.31) return {bg:'#dcfce7',tx:'#166534',bd:'#86efac',lbl:'Strength',tier:'strength'};
  if(rank<total*0.70) return {bg:'#fef9c3',tx:'#854d0e',bd:'#fde047',lbl:'Developing',tier:'dev'};
  return {bg:'#fee2e2',tx:'#991b1b',bd:'#fca5a5',lbl:'Work-On',tier:'workon'};
}

function themeBreakdown(fid,stmtAvgMap){
  const factor=ALL_FACTORS.find(f=>f.id===fid);
  if(!factor) return [];
  const themes={};
  factor.stmts.forEach(s=>{
    const v=stmtAvgMap[s.id]; if(v==null) return;
    if(!themes[s.th]) themes[s.th]={name:s.th,scores:[],stmts:[]};
    themes[s.th].scores.push(v);
    themes[s.th].stmts.push({text:s.t,score:v});
  });
  return Object.values(themes).map(th=>({
    name:th.name,
    avg:th.scores.reduce((a,b)=>a+b,0)/th.scores.length,
    stmts:th.stmts.sort((a,b)=>a.score-b.score),
  })).sort((a,b)=>a.avg-b.avg);
}

/* ════════════════════════════════════════════════════════════
   ALIGNMENT, SPOTLIGHT & NARRATIVE
════════════════════════════════════════════════════════════ */
function factorAlignment(fid, resps){
  const vals = resps.map(r => respFactorScore(fid, r)).filter(v => v !== null);
  if(vals.length < 2) return null;
  const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
  const sd   = Math.sqrt(vals.reduce((a,b) => a+(b-mean)**2, 0) / (vals.length-1));
  if(sd < 0.8)  return {lbl:'Aligned', col:'#0369a1', bg:'#e0f2fe', icon:'●'};
  if(sd < 1.3)  return {lbl:'Mixed',   col:'#ca8a04', bg:'#fef9c3', icon:'●'};
  return              {lbl:'Divided',  col:'#dc2626', bg:'#fee2e2', icon:'●'};
}

function lowestStmt(fid, avgMap){
  const f = ALL_FACTORS.find(x => x.id === fid);
  if(!f) return null;
  return f.stmts
    .map(s => ({text: s.t, score: avgMap[s.id] ?? null}))
    .filter(s => s.score !== null)
    .sort((a,b) => a.score - b.score)[0] || null;
}

function generateNarrative(eng, resps, scores, ranked, total){
  const pRanked = PILLARS.map(p => ({name:p.name, em:p.em, avg:scores[p.id].avg})).sort((a,b)=>b.avg-a.avg);
  const best = pRanked[0], worst = pRanked[pRanked.length-1];
  const gap  = (best.avg - worst.avg).toFixed(1);
  const topF = ranked[0], botF = ranked[ranked.length-1];
  const divided = ranked.filter(f => { const a=factorAlignment(f.fid,resps); return a&&a.lbl==='Divided'; });
  const nStr = ranked.filter((_,i) => relCol(i,total).tier==='strength').length;
  const nWO  = ranked.filter((_,i) => relCol(i,total).tier==='workon').length;

  let s = `This team's standout capability is <strong>${best.em} ${best.name}</strong> (${best.avg.toFixed(1)}/6), with <strong>${topF.fname}</strong> as the highest-scoring factor across all ${total} areas. `;
  s += `The primary development opportunity sits in <strong>${worst.em} ${worst.name}</strong> (${worst.avg.toFixed(1)}/6) — <strong>${botF.fname}</strong> is the factor most in need of attention. `;
  if(parseFloat(gap) >= 1.2) s += `The ${gap}-point gap between the strongest and weakest pillar is significant and warrants strategic focus. `;
  if(divided.length > 0){
    const names = divided.slice(0,2).map(f=>`<strong>${f.fname}</strong>`).join(' and ');
    s += `Notably, the data reveals <strong>divided views</strong> on ${names} — where team members are having fundamentally different experiences. This is the most important thread to pull in facilitation.`;
  } else {
    s += `The team shows broadly consistent views across factors, suggesting a shared experience — a useful foundation for collective development.`;
  }
  return `<div class="bg-gradient-to-br from-blue-50 to-slate-50 rounded-2xl border border-blue-100 p-5">
    <div class="flex gap-3">
      <span class="text-2xl shrink-0">💡</span>
      <div>
        <h2 class="font-bold text-slate-800 text-sm mb-1.5">Team Snapshot — ${eng.name}</h2>
        <p class="text-slate-600 text-sm leading-relaxed">${s}</p>
        <div class="flex gap-4 mt-3 pt-3 border-t border-blue-100 text-xs text-slate-500">
          <span><strong class="text-green-700">${nStr}</strong> Strength${nStr!==1?'s':''}</span>
          <span><strong class="text-amber-600">${total-nStr-nWO}</strong> Developing</span>
          <span><strong class="text-red-700">${nWO}</strong> Work-On${nWO!==1?'s':''}</span>
          <span><strong class="text-slate-700">${resps.length}</strong> respondent${resps.length!==1?'s':''}</span>
          ${divided.length>0?`<span class="text-red-600 font-semibold">⚠ ${divided.length} divided factor${divided.length!==1?'s':''}</span>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

/* ════════════════════════════════════════════════════════════
   MATURITY MODEL
════════════════════════════════════════════════════════════ */
function maturity(score){
  if(score<2) return {lbl:'Underpower',col:'#dc2626',bg:'#fee2e2'};
  if(score<3) return {lbl:'Developing', col:'#f97316',bg:'#ffedd5'};
  if(score<4) return {lbl:'Defined',    col:'#ca8a04',bg:'#fef9c3'};
  if(score<5) return {lbl:'Advanced',   col:'#16a34a',bg:'#dcfce7'};
  return             {lbl:'Exemplary',  col:'#0369a1',bg:'#e0f2fe'};
}

/* ════════════════════════════════════════════════════════════
   STATISTICS — Welch's t-test
════════════════════════════════════════════════════════════ */
function gammaLn(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,1.208650973866179e-3,-5.395239384953e-6];
  let y=x,tmp=(x+0.5)*Math.log(x+5.5)-(x+5.5),ser=1.000000000190015;
  for(let j=0;j<6;j++) ser+=c[j]/++y;
  return tmp+Math.log(2.5066282746310005*ser/x);
}
function betaInc(x,a,b){
  if(x<=0)return 0; if(x>=1)return 1;
  const lbeta=gammaLn(a)+gammaLn(b)-gammaLn(a+b);
  const bt=Math.exp(a*Math.log(x)+b*Math.log(1-x)-lbeta);
  const EPS=3e-7,FPMIN=1e-30,MAXIT=200;
  function cf(x,a,b){
    let c=1,d=1-(a+b)*x/(a+1);
    if(Math.abs(d)<FPMIN)d=FPMIN; d=1/d; let h=d;
    for(let m=1;m<=MAXIT;m++){
      let aa=m*(b-m)*x/((a+2*m-1)*(a+2*m));
      d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;
      aa=-(a+m)*(a+b+m)*x/((a+2*m)*(a+2*m+1));
      d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;
      const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;
    }
    return h;
  }
  return x<(a+1)/(a+b+2)?bt*cf(x,a,b)/a:1-bt*cf(1-x,b,a)/b;
}
function tPVal(t,df){ return betaInc(df/(df+t*t),df/2,0.5); }
function respFactorScore(fid,resp){
  const f=ALL_FACTORS.find(x=>x.id===fid);
  const vals=f.stmts.map(s=>{const v=resp.ratings[s.id];return v!=null?(s.rev?7-v:v):null;}).filter(v=>v!=null);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
function welchTest(fid,respsA,respsB){
  const a=respsA.map(r=>respFactorScore(fid,r)).filter(v=>v!=null);
  const b=respsB.map(r=>respFactorScore(fid,r)).filter(v=>v!=null);
  if(a.length<2||b.length<2) return null;
  const n1=a.length,n2=b.length;
  const m1=a.reduce((s,v)=>s+v,0)/n1,m2=b.reduce((s,v)=>s+v,0)/n2;
  const v1=a.reduce((s,v)=>s+(v-m1)**2,0)/(n1-1),v2=b.reduce((s,v)=>s+(v-m2)**2,0)/(n2-1);
  const se=Math.sqrt(v1/n1+v2/n2);
  if(se<1e-10) return {p:1,d:0,n1,n2};
  const t=(m2-m1)/se;
  const df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1));
  const p=tPVal(Math.abs(t),Math.max(df,1));
  const sp=Math.sqrt(((n1-1)*v1+(n2-1)*v2)/(n1+n2-2));
  return {p,d:sp>0?Math.abs(m2-m1)/sp:0,n1,n2};
}
function sigBadge(stat){
  if(!stat) return `<span class="text-slate-300 text-[10px]">—</span>`;
  if(stat.p<0.05) return `<span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-700 cursor-help" title="Significant: p=${stat.p.toFixed(3)}, n=${stat.n1}→${stat.n2}, d=${stat.d.toFixed(2)}">★ sig.</span>`;
  if(stat.p<0.10) return `<span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-500 cursor-help" title="Near significant: p=${stat.p.toFixed(3)}, n=${stat.n1}→${stat.n2}">~ near</span>`;
  return `<span class="text-[10px] text-slate-400 cursor-help" title="Not significant: p=${stat.p.toFixed(3)}">ns</span>`;
}

/* ════════════════════════════════════════════════════════════
   CHAIN HELPERS
════════════════════════════════════════════════════════════ */
function chainRootId(engId){
  let e=ENGAGEMENTS.find(x=>x.id===engId);
  while(e&&e.parentId){const p=ENGAGEMENTS.find(x=>x.id===e.parentId);if(!p)break;e=p;}
  return e?e.id:engId;
}
function buildChain(rootId){
  const root=ENGAGEMENTS.find(e=>e.id===rootId);
  if(!root) return [];
  const chain=[root]; let cur=root;
  while(true){const next=ENGAGEMENTS.find(e=>e.parentId===cur.id);if(!next)break;chain.push(next);cur=next;}
  return chain;
}

function exportCSV(eng){
  const resps=RESPONSES.filter(r=>r.engId===eng.id);
  const hdrs=['Respondent #','Date','Pillar','Factor','Theme','Statement','Raw Rating','Adjusted Rating'];
  const rows=[hdrs.join(',')];
  resps.forEach((r,i)=>{
    ALL_STMTS.forEach(s=>{
      const raw=r.ratings[s.id]??'';
      const adj=raw!==''?(s.rev?(7-raw):raw):'';
      rows.push([`"Respondent ${i+1}"`,`"${new Date(r.ts).toLocaleDateString('en-GB')}"`,
        `"${s.pname}"`,`"${s.fname}"`,`"${s.th}"`,`"${s.t.replace(/"/g,'""')}"`,raw,adj].join(','));
    });
  });
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'})),download:`HPT_${eng.name}_${new Date().toISOString().slice(0,10)}.csv`});
  a.click();
}

/* ════════════════════════════════════════════════════════════
   SVG RADAR
════════════════════════════════════════════════════════════ */
function radarSVG(pillars,scores,size=220){
  const cx=size/2,cy=size/2,r=size*0.33,n=pillars.length;
  const grids=[.25,.5,.75,1].map(f=>`<circle cx="${cx}" cy="${cy}" r="${(r*f).toFixed(1)}" fill="none" stroke="#e2e8f0"/>`).join('');
  const axes=pillars.map((_,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e2e8f0"/>`;}).join('');
  const pts=pillars.map((p,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2,dr=(scores[p.id].avg/6)*r;return `${(cx+dr*Math.cos(a)).toFixed(1)},${(cy+dr*Math.sin(a)).toFixed(1)}`;}).join(' ');
  const lbls=pillars.map((p,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2,lr=r+24,x=cx+lr*Math.cos(a),y=cy+lr*Math.sin(a);const words=p.name.split(' ');return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="10" fill="#475569">${words.map((w,wi)=>`<tspan x="${x.toFixed(1)}" dy="${wi===0?(words.length>1?'-0.5em':'0.3em'):'1.2em'}">${w}</tspan>`).join('')}</text>`;}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="mx-auto">${grids}${axes}<polygon points="${pts}" fill="#0369a1" fill-opacity="0.18" stroke="#0369a1" stroke-width="2"/>${lbls}</svg>`;
}

async function delEng(id){
  if(!confirm('Delete this engagement and all its responses?')) return;
  showLoader('Deleting…');
  try{
    await SB.from('responses').delete().eq('eng_id',id);
    await SB.from('engagements').delete().eq('id',id);
    await loadData(); go('admin');
  }catch(e){ showError(e.message); }
}

async function createRescan(parentId){
  const parent=ENGAGEMENTS.find(e=>e.id===parentId);
  if(!parent) return;
  const prefix=parent.client.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()||'HPT';
  const code=prefix+Math.floor(1000+Math.random()*9000);
  const chain=buildChain(chainRootId(parentId));
  const baseName=parent.name.replace(/ \(Re-scan \d+\)$/,'');
  const scanNum=chain.length;
  const eng={id:Date.now().toString(),name:`${baseName} (Re-scan ${scanNum})`,client:parent.client,code,descs:parent.descs||{},ts:new Date().toISOString(),parent_id:parentId};
  showLoader('Creating re-scan…');
  try{
    await SB.from('engagements').insert([eng]);
    await loadData();
    alert(`Re-scan ${scanNum} created!\n\nSurvey code: ${code}\n\nShare this with your team to begin the follow-up assessment.`);
    go('admin');
  }catch(e){ showError(e.message); }
}

async function svNext(){
  if(SV.fi<ALL_FACTORS.length-1){SV.fi++;renderSurvey();window.scrollTo(0,0);}

      const resp={id:Date.now().toString(),eng_id:ACTIVE_ENG.id,ratings:{...SV.ratings},ts:new Date().toISOString()};

      SV.phase='done'; renderSurvey();

}

  const resps=RESPONSES.filter(r=>r.engId===eng.id);
  if(!resps.length) return `<div class="min-h-screen bg-slate-50">

    </div>

      <h2 class="text-xl font-semibold text-slate-700 mb-2">No responses yet</h2>

      <p class="text-slate-400 text-sm mt-2">Use ↻ Refresh to check for new submissions.</p>
    </div>
  </div>`;

  const scores=computeScores(resps);
  const ranked=rankedFactors(scores);
  const total=ranked.length;
  const avgMap=stmtAvgs(resps);
  const inChain=!!eng.parentId||ENGAGEMENTS.some(x=>x.parentId===eng.id);
  const narrativeHTML = clientMode ? '' : generateNarrative(eng,resps,scores,ranked,total);

  const pillarCards=PILLARS.map(p=>{
    const avg=scores[p.id].avg,pct=(avg/6)*100;
    const mat=maturity(avg);
    return `<div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm card">
      <div class="flex items-center gap-2 mb-2"><span class="text-xl">${p.em}</span><span class="font-semibold text-sm text-slate-700">${p.name}</span></div>
      <div class="flex items-end gap-1 mb-2"><span class="text-3xl font-bold" style="color:${p.col}">${avg.toFixed(1)}</span><span class="text-slate-400 text-sm pb-1"> / 6.0</span></div>
      <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full pbar" style="width:${pct.toFixed(1)}%;background:${p.col}"></div></div>
      <div class="mt-2 text-xs font-semibold" style="color:${mat.col}">${mat.lbl}</div>
    </div>`;
  }).join('');

  const barChart=PILLARS.map(p=>{
    const avg=scores[p.id].avg,pct=(avg/6)*100;
    return `<div class="flex items-center gap-2 mb-2">
      <span class="w-28 text-xs font-medium text-slate-600 shrink-0">${p.name}</span>
      <div class="flex-1 h-5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full pbar flex items-center pl-2" style="width:${pct.toFixed(1)}%;background:${p.col};min-width:36px">
          <span class="text-white text-xs font-bold">${avg.toFixed(1)}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  const factorRows=ranked.map((f,rank)=>{
    const col=relCol(rank,total);
    const pct=(f.score/6)*100;
    const mat=maturity(f.score);
    const intv=INTV[f.fid];
    const align=factorAlignment(f.fid,resps);
    const spotlight=lowestStmt(f.fid,avgMap);
    const isStrength=col.tier==='strength';
    const isWorkOn=col.tier==='workon';
    const canExpand=isStrength||isWorkOn;
    const spotlightHTML=spotlight?`<div class="mt-3 pt-3 border-t border-slate-100">
      <p class="text-xs font-semibold text-slate-500 mb-1.5">📌 Most provocative statement (${spotlight.score.toFixed(1)}/6)</p>
      <p class="text-sm text-slate-600 italic">"${spotlight.text}"</p>
    </div>`:'';
    let expContent='';
    if(isStrength&&intv){
      expContent=`<div class="px-5 pb-5 pt-2" style="background:${col.bg}80">
        <div class="grid md:grid-cols-2 gap-3">
          <div class="bg-white rounded-xl p-4 border" style="border-color:${col.bd}">
            <h4 class="font-bold text-sm mb-3" style="color:${col.tx}">⭐ Super Strength It!</h4>
            <ul class="space-y-2">${intv.ss.map(s=>`<li class="text-sm text-slate-700 flex gap-2"><span class="text-slate-300 shrink-0 mt-0.5">→</span><span>${s}</span></li>`).join('')}</ul>
          </div>
          <div class="bg-white rounded-xl p-4 border border-slate-200">
            <h4 class="font-semibold text-sm text-slate-600 mb-3">🪞 Reflection Prompts</h4>
            <ul class="space-y-2">${intv.r.map(s=>`<li class="text-sm text-slate-700 flex gap-2"><span class="text-slate-300 shrink-0 mt-0.5">?</span><span>${s}</span></li>`).join('')}</ul>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-200 space-y-3">
          ${spotlightHTML}
          <a href="mailto:ah@andrewhallcoaching.com?subject=HPT — Super Strength Session: ${encodeURIComponent(f.fname)}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-white hover:opacity-90" style="background:#059669">📅 Book a Super Strength session</a>
        </div>
      </div>`;
    } else if(isWorkOn&&intv){
      const themes=themeBreakdown(f.fid,avgMap);
      const themeHTML=themes.map((th,ti)=>{
        const thPct=(th.avg/6)*100, isWeakest=ti===0;
        return `<div class="rounded-lg p-3 border ${isWeakest?'border-red-200 bg-red-50':'border-slate-100 bg-white'} mb-2">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold ${isWeakest?'text-red-700':'text-slate-600'}">${th.name}${isWeakest?' — Focus here':''}</span>
            <span class="text-xs font-bold ${isWeakest?'text-red-700':'text-slate-500'}">${th.avg.toFixed(1)}</span>
          </div>
          <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full rounded-full" style="width:${thPct.toFixed(1)}%;background:${isWeakest?'#ef4444':'#94a3b8'}"></div>
          </div>
        </div>`;
      }).join('');
      expContent=`<div class="px-5 pb-5 pt-2" style="background:${col.bg}80">
        <div class="grid md:grid-cols-2 gap-3 mb-3">
          <div class="bg-white rounded-xl p-4 border" style="border-color:${col.bd}">
            <h4 class="font-bold text-sm mb-3" style="color:${col.tx}">💡 Suggested Interventions</h4>
            <ul class="space-y-2">${intv.s.map(s=>`<li class="text-sm text-slate-700 flex gap-2"><span class="text-slate-300 shrink-0 mt-0.5">→</span><span>${s}</span></li>`).join('')}</ul>
          </div>
          <div class="bg-white rounded-xl p-4 border border-slate-200">
            <h4 class="font-semibold text-sm text-slate-600 mb-3">🪞 Reflection Prompts</h4>
            <ul class="space-y-2">${intv.r.map(s=>`<li class="text-sm text-slate-700 flex gap-2"><span class="text-slate-300 shrink-0 mt-0.5">?</span><span>${s}</span></li>`).join('')}</ul>
          </div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 mb-3">
          <h4 class="font-semibold text-sm text-slate-700 mb-3">📊 What the data is saying — themes within ${f.fname}</h4>
          ${themeHTML}
        </div>
        <div class="pt-2 border-t border-slate-200 space-y-3">
          ${spotlightHTML}
          <a href="mailto:ah@andrewhallcoaching.com?subject=HPT — Work-On Session: ${encodeURIComponent(f.fname)}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-white hover:opacity-90" style="background:#0369a1">📅 Book a focused session on ${f.fname}</a>
        </div>
      </div>`;
    }
    return `<div class="border-b border-slate-100 last:border-0">
      <div class="${canExpand?'cursor-pointer hover:bg-slate-50':'cursor-default'} transition-colors" onclick="${canExpand?`toggleExp('exp-${f.fid}',this)`:''}">
        <div class="flex items-center gap-3 px-5 py-4">
          <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500 shrink-0">${rank+1}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="font-semibold text-slate-800">${f.fname}</span>
              <span class="text-xs font-medium" style="color:${f.pcol}">· ${f.pname}</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full rounded-full pbar" style="width:${pct.toFixed(1)}%;background:${col.tx}"></div>
              </div>
              <span class="text-sm font-bold w-8 text-right" style="color:${col.tx}">${f.score.toFixed(1)}</span>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <div class="text-right">
              <div><span class="text-xs px-2 py-0.5 rounded-full font-semibold border" style="background:${col.bg};color:${col.tx};border-color:${col.bd}">${col.lbl}</span></div>
              <div class="text-[10px] mt-0.5 font-semibold" style="color:${mat.col}">${mat.lbl}</div>
              ${align?`<div class="text-[10px] mt-0.5 font-semibold cursor-help" style="color:${align.col}" title="Team alignment on this factor (based on response spread)">${align.icon} ${align.lbl}</div>`:''}
            </div>
            ${canExpand?'<span class="exp-arrow text-slate-300 text-sm">▼</span>':'<span class="text-slate-200 text-sm">—</span>'}
          </div>
        </div>
      </div>
      <div id="exp-${f.fid}" class="exp-body">${expContent}</div>
    </div>`;
  }).join('');

  const header = clientMode ? `
    <div class="bg-white border-b border-slate-200 px-5 py-4 sticky top-0 z-10 no-print">
      <div class="max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-2xl">⚡</span>
          <div><h1 class="font-bold text-slate-800 text-lg leading-tight">${eng.name}</h1>
          <p class="text-slate-400 text-xs">${eng.client} · Team Assessment Results · andrewhallcoaching.com</p></div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="openExecSummary()" class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-100">📄 Export PDF</button>
        </div>
      </div>
    </div>` : `
    <div class="bg-white border-b border-slate-200 px-5 py-4 sticky top-0 z-10 no-print">
      <div class="max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="go('admin')" class="text-slate-400 hover:text-slate-600 text-sm">← Back</button>
          <div><h1 class="font-bold text-slate-800 text-lg leading-tight">${eng.name}</h1>
          <p class="text-slate-400 text-xs">${eng.client} · ${resps.length} anonymous response${resps.length!==1?'s':''}</p></div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="refreshAndRender()" class="px-3 py-2 rounded-xl text-sm bg-slate-100 text-slate-600 hover:bg-slate-200">↻</button>
          ${inChain?`<button onclick='viewCompare("${eng.id}")' class="px-3 py-2 rounded-xl text-sm font-medium bg-purple-50 text-purple-700 hover:bg-purple-100">📊 Progression</button>`:''}
          <button onclick='exportCSV(ACTIVE_ENG)' class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">⬇ CSV</button>
          <button id="share-btn" onclick='shareClientLink("${eng.code}")' class="px-4 py-2 rounded-xl text-sm font-medium bg-green-50 text-green-700 hover:bg-green-100">🔗 Share with Client</button>
          <button onclick="openExecSummary()" class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-100">📄 Export PDF</button>
        </div>
      </div>
    </div>`;

  return `<div class="min-h-screen bg-slate-50">
    ${header}
    <div class="max-w-5xl mx-auto p-5 space-y-5 fade">
      ${narrativeHTML}
      <div><h2 class="text-base font-bold text-slate-800 mb-3">Pillar Overview</h2>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${pillarCards}</div></div>
      <div class="grid lg:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"><h3 class="font-semibold text-slate-700 mb-3 text-sm">Team Radar Profile</h3>${radarSVG(PILLARS,scores)}</div>
        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
          <h3 class="font-semibold text-slate-700 mb-4 text-sm">Pillar Scores (out of 6)</h3>
          <div class="mt-2">${barChart}</div>
          <div class="mt-4 pt-4 border-t border-slate-100">
            <p class="text-xs font-semibold text-slate-500 mb-2">Maturity Scale</p>
            <div class="flex flex-wrap gap-1">${['Underpower','Developing','Defined','Advanced','Exemplary'].map((lbl,i)=>{const m=maturity([1.5,2.5,3.5,4.5,5.5][i]);return `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold" style="background:${m.bg};color:${m.col}">${m.lbl} ${[1,2,3,4,5][i]}–${[2,3,4,5,6][i]}</span>`;}).join('')}</div>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-5 border-b border-slate-100">
          <h2 class="font-bold text-slate-800">All Factors — Ranked</h2>
          <p class="text-slate-400 text-xs mt-0.5">Strengths and Work-Ons are expandable. Each factor shows Team Tier (relative) and Maturity level (absolute benchmark).</p>
        </div>
        <div>${factorRows}</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm text-center">
        <p class="text-slate-400 text-sm">🔒 ${resps.length} anonymous response${resps.length!==1?'s':''} · No personal data stored</p>
      </div>
    </div>
  </div>`;
}

/* ════════════════════════════════════════════════════════════
   PROGRESSION — multi-scan with significance
════════════════════════════════════════════════════════════ */
function compareHTML(){
  const root=ACTIVE_ENG;
  if(!root) return `<div class="p-10 text-center text-slate-400">No data.</div>`;
  const chain=buildChain(root.id);
  if(chain.length<2) return `<div class="min-h-screen bg-slate-50">
    <div class="bg-white border-b border-slate-200 px-5 py-4 flex items-center gap-3">
      <button onclick="go('admin')" class="text-slate-400 text-sm">← Back</button><h1 class="font-bold text-slate-800 text-xl">Progression</h1>
    </div><div class="flex flex-col items-center justify-center py-32 text-center px-5">
      <div class="text-4xl mb-4">📭</div>
      <p class="text-slate-500">At least two scans are needed. Use "+ Re-scan" in Admin.</p>
    </div></div>`;

  const chainResps=chain.map(eng=>RESPONSES.filter(r=>r.engId===eng.id));
  const emptyIdx=chainResps.findIndex(r=>r.length===0);
  if(emptyIdx>=0) return `<div class="min-h-screen bg-slate-50">
    <div class="bg-white border-b border-slate-200 px-5 py-4 flex items-center gap-3">
      <button onclick="go('admin')" class="text-slate-400 text-sm">← Back</button><h1 class="font-bold text-slate-800 text-xl">Progression</h1>
    </div><div class="flex flex-col items-center justify-center py-32 text-center px-5">
      <div class="text-4xl mb-4">📭</div>
      <p class="text-slate-500 font-medium">${chain[emptyIdx].name}</p>
      <p class="text-slate-400 text-sm mt-1">This scan has no responses yet.</p>
    </div></div>`;

  const chainScores=chain.map((eng,i)=>computeScores(chainResps[i]));
  const scanLabel=(i)=>i===0?'Original':'Re-scan '+i;
  const scanDate=(eng)=>new Date(eng.ts).toLocaleDateString('en-GB',{month:'short',year:'numeric'});

  const pillarSection=PILLARS.map(p=>{
    const pScores=chainScores.map(s=>s[p.id].avg);
    const overall=pScores[pScores.length-1]-pScores[0];
    const oArrow=overall>0.1?'↑':overall<-0.1?'↓':'→';
    const oCol=overall>0.1?'#059669':overall<-0.1?'#dc2626':'#94a3b8';
    const dots=pScores.map((score,i)=>{
      const diff=i>0?score-pScores[i-1]:null;
      const dArrow=diff!=null?(diff>0.1?'↑':diff<-0.1?'↓':'→'):null;
      const dCol=diff!=null?(diff>0.1?'#059669':diff<-0.1?'#dc2626':'#94a3b8'):null;
      return `<div class="flex flex-col items-center min-w-0">
        <div class="text-[10px] text-slate-400 mb-0.5">${scanLabel(i)}</div>
        <div class="text-lg font-bold" style="color:${p.col}">${score.toFixed(1)}</div>
        <div class="text-[10px] text-slate-400">${scanDate(chain[i])}</div>
        ${diff!=null?`<div class="text-xs font-bold mt-0.5" style="color:${dCol}">${dArrow}${Math.abs(diff).toFixed(2)}</div>`:'<div class="invisible text-xs mt-0.5">—</div>'}
      </div>`;
    });
    const dotsHtml=dots.reduce((acc,d,i)=>i===0?[d]:[...acc,`<div class="flex items-center pt-4 text-slate-200 px-1">›</div>`,d],[]).join('');
    return `<div class="bg-white rounded-xl border border-slate-200 p-4">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-lg">${p.em}</span><span class="font-semibold text-slate-700 text-sm flex-1">${p.name}</span>
        <span class="text-base font-bold" style="color:${oCol}">${oArrow}</span>
        <span class="text-sm font-bold" style="color:${oCol}">${overall>=0?'+':''}${overall.toFixed(2)}</span>
      </div>
      <div class="flex items-start gap-1 flex-wrap">${dotsHtml}</div>
    </div>`;
  }).join('');

  // ── Momentum callout (last two scans) ────────────────────
  const lastI=chain.length-1;
  const factorDeltas=PILLARS.flatMap(p=>p.factors.map(f=>{
    const prev=chainScores[lastI-1][p.id]?.factors[f.id]?.score??0;
    const curr=chainScores[lastI][p.id]?.factors[f.id]?.score??0;
    return {fname:f.name,pname:p.name,pcol:p.col,delta:curr-prev,curr};
  })).sort((a,b)=>b.delta-a.delta);
  const gainers=factorDeltas.filter(f=>f.delta>0.1);
  const decliners=factorDeltas.filter(f=>f.delta<-0.1).reverse();
  const stable=factorDeltas.filter(f=>Math.abs(f.delta)<=0.1);
  const momentumHTML=`<div class="bg-white rounded-2xl border border-slate-200 p-5">
    <h2 class="font-bold text-slate-800 mb-1">⚡ Key Movers — Scan ${lastI} → ${lastI+1}</h2>
    <p class="text-slate-400 text-xs mb-4">Movement between the two most recent scans across all 13 factors.</p>
    <div class="grid sm:grid-cols-3 gap-3">
      <div class="rounded-xl p-4 border border-green-100 bg-green-50">
        <p class="text-xs font-bold text-green-700 mb-2">🚀 Biggest gains (${gainers.length})</p>
        ${gainers.slice(0,3).map(f=>`<div class="flex items-center justify-between mb-1.5">
          <span class="text-sm font-medium text-slate-700 truncate mr-2">${f.fname}</span>
          <span class="text-sm font-bold text-green-600 shrink-0">+${f.delta.toFixed(2)}</span>
        </div>`).join('')||'<p class="text-xs text-slate-400 italic">No significant gains</p>'}
      </div>
      <div class="rounded-xl p-4 border border-red-100 bg-red-50">
        <p class="text-xs font-bold text-red-700 mb-2">⚠ Watch out (${decliners.length})</p>
        ${decliners.slice(0,3).map(f=>`<div class="flex items-center justify-between mb-1.5">
          <span class="text-sm font-medium text-slate-700 truncate mr-2">${f.fname}</span>
          <span class="text-sm font-bold text-red-600 shrink-0">${f.delta.toFixed(2)}</span>
        </div>`).join('')||'<p class="text-xs text-slate-400 italic">No declines — great news</p>'}
      </div>
      <div class="rounded-xl p-4 border border-slate-100 bg-slate-50">
        <p class="text-xs font-bold text-slate-500 mb-2">→ Holding steady (${stable.length})</p>
        ${stable.slice(0,3).map(f=>`<div class="flex items-center justify-between mb-1.5">
          <span class="text-sm font-medium text-slate-700 truncate mr-2">${f.fname}</span>
          <span class="text-sm font-bold text-slate-400 shrink-0">${f.delta>=0?'+':''}${f.delta.toFixed(2)}</span>
        </div>`).join('')}
        ${stable.length>3?`<p class="text-xs text-slate-400">+${stable.length-3} more stable</p>`:''}
      </div>
    </div>
  </div>`;

  const ranked=rankedFactors(chainScores[0]);
  const colHeaders=chain.map((eng,i)=>`<th class="px-3 py-3 text-center min-w-[88px]">
    <div class="text-xs font-bold text-slate-700">${scanLabel(i)}</div>
    <div class="text-[10px] text-slate-400 font-normal">${scanDate(eng)}</div>
    <div class="text-[10px] text-slate-400">n=${chainResps[i].length}</div>
  </th>`).join('');

  const factorRows=ranked.map((f,rank)=>{
    const fScores=chainScores.map(s=>s[f.pid]?.factors[f.fid]?.score??0);
    const latestScore=fScores[fScores.length-1];
    const mat=maturity(latestScore);
    const col=relCol(rank,ranked.length);
    const scoreCells=fScores.map((score,i)=>{
      const delta=i>0?score-fScores[i-1]:null;
      const sig=i>0?welchTest(f.fid,chainResps[i-1],chainResps[i]):null;
      const improved=delta!=null&&delta>0.1, declined=delta!=null&&delta<-0.1;
      const arrow=delta==null?'':improved?'↑':declined?'↓':'→';
      const arrowCol=improved?'#059669':declined?'#dc2626':'#94a3b8';
      const pct=(score/6)*100;
      return `<td class="px-3 py-3 text-center align-top">
        <div class="font-bold text-slate-800 text-sm">${score.toFixed(1)}</div>
        <div class="h-1 bg-slate-100 rounded-full mt-1 w-10 mx-auto overflow-hidden">
          <div class="h-full rounded-full" style="width:${pct.toFixed(0)}%;background:${i===fScores.length-1?mat.col:'#94a3b8'}"></div>
        </div>
        ${delta!=null?`<div class="mt-1 space-y-0.5">
          <div class="font-bold text-sm" style="color:${arrowCol}">${arrow} ${Math.abs(delta).toFixed(2)}</div>
          <div>${sigBadge(sig)}</div>
        </div>`:''}
      </td>`;
    }).join('');
    return `<tr class="border-b border-slate-100 hover:bg-slate-50">
      <td class="px-4 py-3 align-top">
        <div class="font-semibold text-slate-800 text-sm">${f.fname}</div>
        <div class="text-xs mt-0.5" style="color:${f.pcol}">${f.pname}</div>
      </td>
      ${scoreCells}
      <td class="px-3 py-3 text-center align-top"><span class="text-xs px-1.5 py-0.5 rounded-full font-semibold whitespace-nowrap" style="background:${mat.bg};color:${mat.col}">${mat.lbl}</span></td>
      <td class="px-3 py-3 text-center align-top"><span class="text-xs px-1.5 py-0.5 rounded-full font-semibold border whitespace-nowrap" style="background:${col.bg};color:${col.tx};border-color:${col.bd}">${col.lbl}</span></td>
    </tr>`;
  }).join('');

  return `<div class="min-h-screen bg-slate-50">
    <div class="bg-white border-b border-slate-200 px-5 py-4 sticky top-0 z-10">
      <div class="max-w-5xl mx-auto flex items-center gap-3">
        <button onclick="go('admin')" class="text-slate-400 hover:text-slate-600 text-sm">← Back</button>

function shareClientLink(code){
  const url = window.location.origin + window.location.pathname + '?view=' + encodeURIComponent(code);
  navigator.clipboard.writeText(url).then(()=>{
    const btn = document.getElementById('share-btn');
    if(btn){ btn.textContent='✅ Link copied!'; setTimeout(()=>{ btn.textContent='🔗 Share with Client'; },2500); }
  }).catch(()=>{
    prompt('Copy this link to share with your client:', url);
  });
}

async function boot(){
  if(!initSupabase()){
    document.getElementById('app').innerHTML=setupHTML();
    return;
  }
  showLoader('Connecting to database…');
  try{
    await loadData();
    const urlParams = new URLSearchParams(window.location.search);
    const viewCode = urlParams.get('view');
    if(viewCode){
      const eng = ENGAGEMENTS.find(e => e.code.toUpperCase() === viewCode.toUpperCase());
      if(eng){ ACTIVE_ENG=eng; VIEW='client'; }
      else { showError('Results not found. Please check your link.'); return; }
    }
    render();
  }catch(e){
    showError('Could not connect to Supabase: '+e.message);
  }
}

boot();
